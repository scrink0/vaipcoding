<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyLearn - Бесплатный курс Python</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>

    <style>
        * { font-family: 'Inter', sans-serif; }
        
        .code-editor {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            resize: vertical;
            min-height: 200px;
            tab-size: 4;
        }
        
        .code-editor:focus {
            outline: none;
        }
        
        .sidebar-item:hover {
            background: #2d3748;
        }
        
        .sidebar-item.active {
            background: #38a169;
            color: white;
        }
        
        .sidebar-item.completed::before {
            content: '✓';
            margin-right: 8px;
            color: #48bb78;
        }
        
        .output-console {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .progress-bar {
            transition: width 0.3s ease;
        }
        
        .lesson-content h1 { font-size: 2rem; font-weight: bold; margin-bottom: 1rem; color: #48bb78; }
        .lesson-content h2 { font-size: 1.5rem; font-weight: bold; margin: 1.5rem 0 1rem; color: #68d391; }
        .lesson-content h3 { font-size: 1.25rem; font-weight: bold; margin: 1rem 0 0.5rem; color: #9ae6b4; }
        .lesson-content p { margin-bottom: 1rem; line-height: 1.7; }
        .lesson-content ul, .lesson-content ol { margin: 1rem 0; padding-left: 2rem; }
        .lesson-content li { margin-bottom: 0.5rem; line-height: 1.6; }
        .lesson-content code {
            background: #2d3748;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #68d391;
        }
        .lesson-content pre {
            background: #1a202c;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1rem 0;
        }
        .lesson-content pre code {
            background: none;
            padding: 0;
        }
        
        .btn-primary {
            background: #48bb78;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn-primary:hover {
            background: #38a169;
            transform: translateY(-1px);
        }
        
        .btn-primary:disabled {
            background: #718096;
            cursor: not-allowed;
            transform: none;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: #2d3748;
            padding: 2rem;
            border-radius: 1rem;
            max-width: 500px;
            width: 90%;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100">
    <!-- Header -->

                    </div>
                    <textarea id="codeEditor" class="code-editor w-full p-4 rounded-lg" spellcheck="false"></textarea>

                        <div id="outputConsole" class="output-console p-4 rounded-lg min-h-[100px]"></div>
                    </div>
                </div>

                <!-- Navigation Buttons -->
                <div class="flex justify-between">
                    <button onclick="previousLesson()" id="prevBtn" class="bg-gray-700 hover:bg-gray-600 text-white px-6 py-3 rounded-lg font-semibold transition">

                    </button>
                    <button onclick="nextLesson()" id="nextBtn" class="btn-primary">
                        Следующий урок →
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Completion Modal -->
    <div id="completionModal" class="modal">

            <button onclick="closeModal()" class="btn-primary">

            </button>
        </div>
    </div>

        // State management
        let currentModuleIndex = 0;
        let currentLessonIndex = 0;
        let completedLessons = new Set();
        let pyodide = null;

        // Initialize Pyodide
        async function initPyodide() {
            try {
                pyodide = await loadPyodide();
                console.log('Pyodide initialized');
            } catch (error) {
                console.error('Failed to initialize Pyodide:', error);
            }
        }

        // Load progress from localStorage
        function loadProgress() {
            const saved = localStorage.getItem('pylearn_progress');
            if (saved) {
                completedLessons = new Set(JSON.parse(saved));
            }
        }

        // Save progress to localStorage
        function saveProgress() {
            localStorage.setItem('pylearn_progress', JSON.stringify([...completedLessons]));
        }

        // Render sidebar
        function renderSidebar() {
            const moduleList = document.getElementById('moduleList');
            moduleList.innerHTML = '';

            courseData.modules.forEach((module, moduleIndex) => {
                const moduleDiv = document.createElement('div');
                moduleDiv.className = 'mb-4';
                
                const moduleTitle = document.createElement('h3');
                moduleTitle.className = 'text-sm font-semibold text-gray-400 mb-2 uppercase tracking-wide';
                moduleTitle.textContent = module.title;
                moduleDiv.appendChild(moduleTitle);

                module.lessons.forEach((lesson, lessonIndex) => {
                    const lessonBtn = document.createElement('button');
                    lessonBtn.className = 'sidebar-item w-full text-left px-3 py-2 rounded-lg text-sm transition';
                    
                    if (moduleIndex === currentModuleIndex && lessonIndex === currentLessonIndex) {
                        lessonBtn.classList.add('active');
                    }
                    
                    if (completedLessons.has(lesson.id)) {
                        lessonBtn.classList.add('completed');
                    }
                    
                    lessonBtn.textContent = lesson.title;
                    lessonBtn.onclick = () => loadLesson(moduleIndex, lessonIndex);
                    moduleDiv.appendChild(lessonBtn);
                });

                moduleList.appendChild(moduleDiv);
            });
        }

        // Load lesson
        function loadLesson(moduleIndex, lessonIndex) {
            currentModuleIndex = moduleIndex;
            currentLessonIndex = lessonIndex;

            const lesson = courseData.modules[moduleIndex].lessons[lessonIndex];
            
            document.getElementById('lessonContent').innerHTML = lesson.content;
            document.getElementById('codeEditor').value = lesson.initialCode;
            document.getElementById('outputConsole').textContent = '';

            renderSidebar();
            updateProgress();
        }

        // Run code
        async function runCode() {
            const code = document.getElementById('codeEditor').value;
            const output = document.getElementById('outputConsole');
            
            if (!pyodide) {
                output.textContent = 'Загрузка Python интерпретатора...';
                return;
            }

            output.textContent = 'Выполнение...\n';
            
            try {
                pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
`);
                
                pyodide.runPython(code);
                
                const result = pyodide.runPython('sys.stdout.getvalue()');
                output.textContent = result || '(нет вывода)';
            } catch (error) {
                output.textContent = `Ошибка: ${error.message}`;
            }
        }

        // Check solution
        async function checkSolution() {
            const code = document.getElementById('codeEditor').value;
            const output = document.getElementById('outputConsole');
            const lesson = courseData.modules[currentModuleIndex].lessons[currentLessonIndex];
            
            if (!pyodide) {
                output.textContent = 'Загрузка Python интерпретатора...';
                return;
            }

            output.textContent = 'Проверка...\n';
            
            try {
                pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
`);
                
                pyodide.runPython(code);
                
                const result = pyodide.runPython('sys.stdout.getvalue()');
                output.textContent = result || '(нет вывода)';
                
                if (result === lesson.expectedOutput) {
                    completedLessons.add(lesson.id);
                    saveProgress();
                    renderSidebar();
                    updateProgress();
                    showCompletionModal();
                } else {
                    output.textContent += '\n\n❌ Ожидаемый вывод:\n' + lesson.expectedOutput;
                }
            } catch (error) {
                output.textContent = `Ошибка: ${error.message}`;
            }
        }

        // Reset code
        function resetCode() {
            const lesson = courseData.modules[currentModuleIndex].lessons[currentLessonIndex];
            document.getElementById('codeEditor').value = lesson.initialCode;
            document.getElementById('outputConsole').textContent = '';
        }

        // Navigation
        function nextLesson() {
            const currentModule = courseData.modules[currentModuleIndex];
            
            if (currentLessonIndex < currentModule.lessons.length - 1) {
                loadLesson(currentModuleIndex, currentLessonIndex + 1);
            } else if (currentModuleIndex < courseData.modules.length - 1) {
                loadLesson(currentModuleIndex + 1, 0);
            }
        }

        function previousLesson() {
            if (currentLessonIndex > 0) {
                loadLesson(currentModuleIndex, currentLessonIndex - 1);
            } else if (currentModuleIndex > 0) {
                const prevModule = courseData.modules[currentModuleIndex - 1];
                loadLesson(currentModuleIndex - 1, prevModule.lessons.length - 1);
            }
        }

        // Update progress
        function updateProgress() {
            const totalLessons = courseData.modules.reduce((sum, module) => sum + module.lessons.length, 0);
            const completedCount = completedLessons.size;
            const percentage = Math.round((completedCount / totalLessons) * 100);
            
            document.getElementById('progressText').textContent = `${percentage}%`;
            document.getElementById('progressBar').style.width = `${percentage}%`;
        }

        // Modal
        function showCompletionModal() {
            document.getElementById('completionModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('completionModal').classList.remove('active');
            nextLesson();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadProgress();
            renderSidebar();
            loadLesson(0, 0);
            updateProgress();
            initPyodide();
        });

        // Handle Tab key in editor
        document.getElementById('codeEditor').addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = e.target.selectionStart;
                const end = e.target.selectionEnd;
                e.target.value = e.target.value.substring(0, start) + '    ' + e.target.value.substring(end);
                e.target.selectionStart = e.target.selectionEnd = start + 4;
            }
        });
    </script>
