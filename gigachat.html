<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeCodeCamp: Python для начинающих</title>
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-panel: #252526;
            --text-light: #d4d4d4;
            --text-comment: #6a9955;
            --text-keyword: #569cd6;
            --text-string: #ce9178;
            --accent: #007acc;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            display: grid; 
            grid-template-rows: auto 1fr; 
            height: 100vh;
        }
        header { 
            background-color: #24292e; 
            color: white; 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        header h1 { margin: 0; font-size: 1.2rem; font-weight: 400; }
        .progress { font-size: 0.9rem; background: var(--accent); padding: 5px 10px; border-radius: 12px; }
        .container { 
            display: grid; 
            grid-template-columns: 2fr 1fr; 
            gap: 15px; 
            padding: 15px; 
            height: calc(100% - 60px); 
            box-sizing: border-box; 
            overflow: hidden;
        }
        .lesson-panel { 
            background: white; 
            border-radius: 8px; 
            padding: 20px; 
            overflow-y: auto; 
            border: 1px solid #ddd;
        }
        .lesson-panel h2 { margin-top: 0; color: #333; }
        .lesson-panel pre { 
            background: var(--bg-dark); 
            color: var(--text-light); 
            padding: 15px; 
            border-radius: 6px; 
            overflow-x: auto;
            font-family: Consolas, Monaco, 'Andale Mono', monospace;
        }
        .lesson-panel code { font-family: Consolas, Monaco, 'Andale Mono', monospace; }
        .keyword { color: var(--text-keyword); }
        .string { color: var(--text-string); }
        .comment { color: var(--text-comment); }
        .editor-panel { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            height: 100%;
        }
        textarea { 
            width: 100%; 
            height: 50%; 
            font-family: Consolas, Monaco, 'Andale Mono', monospace; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 0.95rem; 
            resize: none; 
            box-sizing: border-box;
        }
        iframe { 
            width: 100%; 
            height: 40%; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            background: #000; 
            color: #0f0;
            font-family: Consolas, Monaco, 'Andale Mono', monospace;
            padding: 10px;
            box-sizing: border-box;
            overflow: auto;
        }
        button { 
            padding: 10px 20px; 
            border: none; 
            background: var(--accent); 
            color: white; 
            font-size: 1rem; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:hover { background: #005a9e; }
        button:disabled { background: #555; cursor: not-allowed; }
        .task { background: #e7f3ff; border-left: 4px solid var(--accent); padding: 10px 15px; margin-bottom: 15px; }
    </style>
</head>
<body>

<header>
    <h1>🐍 FreeCodeCamp: Интерактивный курс Python</h1>
    <div class="progress" id="progress">Урок 1 из 3</div>
</header>

<div class="container">
    <!-- Левая панель: Теория -->
    <div class="lesson-panel" id="lessonContent">
        <!-- Контент урока будет вставляться сюда через JS -->
    </div>

    <!-- Правая панель: Редактор и вывод -->
    <div class="editor-panel">
        <textarea id="codeEditor" placeholder="Напишите ваш код здесь..."></textarea>
        <button id="runBtn">▶️ Запустить код</button>
        <div style="font-size: 0.9rem; color: #555;">Вывод программы:</div>
        <iframe id="outputFrame"></iframe>
    </div>
</div>

<!-- Подключаем Pyodide (интерпретатор Python в браузере) -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>

<script>
// === БАЗА ДАННЫХ КУРСА (все уроки в одном месте) ===
const course = [
    {
        id: 0,
        title: "Урок 1: Привет, мир! и Переменные",
        theory: `
            <h2>📘 Урок 1: Привет, мир! и Переменные</h2>
            <p>Python — это язык программирования. Первая программа традиционно выводит текст «Hello, World!».</p>
            <p><strong>Функция print()</strong> выводит данные на экран:</p>
            <pre><code class="language-python">print("Привет, мир!")</code></pre>
            <p><strong>Переменные</strong> нужны для хранения данных. В Python не нужно объявлять тип данных:</p>
            <pre><code class="language-python">имя = "Алексей"
возраст = 25
print(имя, "живет в", "России")
print("Ему", возраст, "лет")</code></pre>
            <div class="task">
                <strong>Задание:</strong> Создайте переменную <code>city</code> со значением <code>"Москва"</code> и выведите на экран фразу: <code>Я живу в Москве</code> (используя переменную).
            </div>
        `,
        solution: `city = "Москва"\nprint("Я живу в", city)`
    },
    {
        id: 1,
        title: "Урок 2: Списки и Циклы",
        theory: `
            <h2>📘 Урок 2: Списки и Циклы</h2>
            <p><strong>Список (list)</strong> — это упорядоченная коллекция элементов:</p>
            <pre><code class="language-python">фрукты = ["яблоко", "банан", "вишня"]
print(фрукты[0]) # Выведет: яблоко</code></pre>
            <p><strong>Цикл for</strong> позволяет перебирать элементы списка один за другим:</p>
            <pre><code class="language-python">фрукты = ["яблоко", "банан", "вишня"]
for фрукт in фрукты:
    print("Я люблю", фрукт)</code></pre>
            <div class="task">
                <strong>Задание:</strong> Создайте список <code>числа = [1, 2, 3, 4, 5]</code>. С помощью цикла <code>for</code> выведите на экран квадраты каждого числа.
            </div>
        `,
        solution: `числа = [1, 2, 3, 4, 5]\nfor n in числа:\n    print(n ** 2)`
    },
    {
        id: 2,
        title: "Урок 3: Функции",
        theory: `
            <h2>📘 Урок 3: Функции</h2>
            <p><strong>Функция</strong> — это именованный блок кода, который можно переиспользовать. Создается через ключевое слово <code>def</code>:</p>
            <pre><code class="language-python">def приветствие(имя):
    print("Привет,", имя + "!")

приветствие("Мария")
приветствие("Иван")</code></pre>
            <p>Функции могут возвращать результат с помощью <code>return</code>:</p>
            <pre><code class="language-python">def сложить(a, b):
    return a + b

результат = сложить(5, 10)
print(результат)</code></pre>
            <div class="task">
                <strong>Задание:</strong> Напишите функцию <code>привет_по_русски(имя)</code>, которая возвращает строку <code>"Привет, [имя]!"</code>. Вызовите её и выведите результат.
            </div>
        `,
        solution: `def привет_по_русски(имя):\n    return "Привет, " + имя + "!"\n\nprint(привет_по_русски("Друг"))`
    }
];

// === ЛОГИКА ПРИЛОЖЕНИЯ ===
let currentLesson = 0;
let pyodide = null;

const lessonPanel = document.getElementById('lessonContent');
const codeEditor = document.getElementById('codeEditor');
const outputFrame = document.getElementById('outputFrame');
const runBtn = document.getElementById('runBtn');
const progressBar = document.getElementById('progress');

// Функция загрузки и отображения урока
function loadLesson(index) {
    const lesson = course[index];
    lessonPanel.innerHTML = lesson.theory;
    codeEditor.value = lesson.solution;
    progressBar.textContent = `Урок ${index + 1} из ${course.length}`;
    
    // Очищаем вывод
    const doc = outputFrame.contentWindow.document;
    doc.open(); doc.write(''); doc.close();
}

// Функция запуска кода
async function runCode() {
    runBtn.disabled = true;
    const doc = outputFrame.contentWindow.document;
    doc.open();
    
    if (!pyodide) {
        doc.write('<em>Загрузка Python...</em>');
        pyodide = await loadPyodide();
        doc.write('<em>Python загружен!</em><br>');
    }

    try {
        // Очищаем стандартный вывод перед новым запуском
        pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
sys.stderr = StringIO()
`);
        
        let userCode = codeEditor.value;
        
        // Чтобы print выводился в наш iframe, перенаправим stdout
        let result = await pyodide.runPythonAsync(`
import sys
from io import StringIO
old_stdout = sys.stdout
sys.stdout = StringIO()
try:
    ${userCode}
    output = sys.stdout.getvalue()
except Exception as e:
    output = f"Ошибка: {e}"
finally:
    sys.stdout = old_stdout
output
        `);
        
        doc.write('<pre style="color: #0f0;">' + result + '</pre>');
    } catch (err) {
        doc.write('<pre style="color: red;">Критическая ошибка интерпретатора</pre>');
    }
    
    doc.close();
    runBtn.disabled = false;
}

// Переключение уроков (для удобства разработки, в реальном проекте нужны кнопки "Next")
// Раскомментируйте строки ниже, если хотите добавить кнопки навигации в HTML
/*
document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentLesson < course.length - 1) {
        currentLesson++;
        loadLesson(currentLesson);
    }
});
document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentLesson > 0) {
        currentLesson--;
        loadLesson(currentLesson);
    }
});
*/

// Обработчики событий
runBtn.addEventListener('click', runCode);

// Запуск первого урока при загрузке страницы
loadLesson(currentLesson);
</script>

</body>
</html>
