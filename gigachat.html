<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>PyCamp: Курс Python</title> <style> :root { --bg-dark: #1e1e1e; --bg-sidebar: #252526; --text-light: #d4d4d4; --text-muted: #858585; --accent: #007acc; --success: #4ec9b0; --error: #f44747; } * { box-sizing: border-box; margin: 0; padding: 0; } body, html { height: 100vh; width: 100vw; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-dark); color: var(--text-light); } .layout { display: flex; height: 100%; } /* Левая панель навигации */ .sidebar { width: 250px; background-color: var(--bg-sidebar); border-right: 1px solid #333; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; } .sidebar h2 { margin-bottom: 1rem; color: var(--accent); font-size: 1.2rem; text-align: center; } .lesson-list { list-style: none; } .lesson-item { padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 5px; cursor: pointer; border: 1px solid transparent; } .lesson-item:hover { background-color: #333; border-color: #444; } .lesson-item.active { background-color: var(--accent); color: #1e1e1e; border-color: var(--accent); } .lesson-item.completed { border-left: 4px solid var(--success); } /* Правая рабочая область */ .main-content { flex-grow: 1; display: flex; flex-direction: column; } .task-area { flex-grow: 1; padding: 1.5rem; display: flex; flex-direction: column; background-color: var(--bg-dark); } .task-area h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--text-light); } .task-area p { color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.6; } .editor-console { display: flex; gap: 1rem; height: 300px; } .code-editor { flex-grow: 1; background-color: #2d2d2d; border-radius: 5px; padding: 1rem; font-family: 'Consolas', 'Monaco', monospace; font-size: 0.95rem; color: #9cdcfe; border: 1px solid #333; resize: vertical; } .console-output { width: 350px; background-color: #2d2d2d; border-radius: 5px; padding: 1rem; font-family: 'Consolas', 'Monaco', monospace; font-size: 0.9rem; color: #dcdcaa; border: 1px solid #333; overflow-y: auto; white-space: pre-wrap; } .controls { padding: 1rem 1.5rem; background-color: #252526; border-top: 1px solid #333; display: flex; justify-content: space-between; align-items: center; } .progress-text { color: var(--text-muted); font-size: 0.9rem; } button { background-color: var(--accent); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 3px; font-size: 1rem; cursor: pointer; transition: background-color 0.2s; } button:hover { background-color: #005a9e; } button:disabled { background-color: #555; cursor: not-allowed; } button.success { background-color: var(--success); } button.success:hover { background-color: #3a9d89; } /* Утилиты */ .hidden { display: none; } </style> </head> <body> <div class="layout"> <aside class="sidebar"> <h2>🐍 PyCamp</h2> <ul class="lesson-list" id="lessonList"></ul> </aside> <div class="main-content"> <section class="task-area"> <h1 id="lessonTitle">Загрузка...</h1> <p id="lessonDesc">Выберите урок в меню слева.</p> </section> <div class="editor-console"> <textarea class="code-editor" id="codeEditor" placeholder="# Напишите ваш код здесь..."></textarea> <div class="console-output" id="consoleOutput">Вывод программы появится здесь...</div> </div> <div class="controls"> <div class="progress-text" id="progressText">Урок 0 из 5</div> <div> <button id="runBtn">Запустить код</button> <button id="nextBtn" class="hidden">Далее &rarr;</button> </div> </div> </div> </div> <script> // --- База данных курса (уроки) --- const lessons = [ { id: 0, title: "Урок 1: Синтаксис и комментарии", description: "Первая программа. В Python отступы (4 пробела) определяют блоки кода. Комментарии начинаются с символа #.", starterCode: 'print("Привет, мир!")\n\n# Это комментарий, он не выполняется' }, { id: 1, title: "Урок 2: Переменные и типы данных", description: "В Python не нужно объявлять тип переменной. Числа (int, float), строки (str) и булевы значения (bool).", starterCode: 'name = "Алексей"\nage = 25\nheight = 1.85\nis_student = True\n\nprint(f"Имя: {name}, Возраст: {age}")' }, { id: 2, title: "Урок 3: Условные операторы", description: "Операторы if, elif, else. Сравнение: == (равно), != (не равно), >, <, >=, <=.", starterCode: 'score = 85\n\nif score >= 90:\n print("Оценка: A")\nelif score >= 75:\n print("Оценка: B")\nelse:\n print("Нужно подтянуть знания")' }, { id: 3, title: "Урок 4: Циклы", description: "Цикл for для перебора и цикл while для выполнения условия. Функция range().', starterCode: '# Выведем квадраты чисел от 1 до 5\nfor i in range(1, 6):\n print(f"{i} в квадрате = {i ** 2}")\n\nprint("\\nЦикл while:")\ncounter = 0\nwhile counter < 3:\n print("Итерация", counter)\n counter += 1' }, { id: 4, title: "Урок 5: Функции", description: "Создание собственных функций с помощью def. Аргументы и возврат значения (return).', starterCode: 'def greet(user_name, age):\n return f"Привет, {user_name}! Тебе {age} лет."\n\nprint(greet("Мария", 30))\n\n# Функция для вычисления факториала\ndef factorial(n):\n if n == 0:\n return 1\n result = 1\n for i in range(1, n + 1):\n result *= i\n return result\n\nprint("Факториал 5:", factorial(5))' } ]; // --- Состояние приложения --- let currentLesson = 0; const completedLessons = new Set(); // --- Элементы DOM --- const lessonList = document.getElementById('lessonList'); const lessonTitle = document.getElementById('lessonTitle'); const lessonDesc = document.getElementById('lessonDesc'); const codeEditor = document.getElementById('codeEditor'); const consoleOutput = document.getElementById('consoleOutput'); const runBtn = document.getElementById('runBtn'); const nextBtn = document.getElementById('nextBtn'); const progressText = document.getElementById('progressText'); // --- Рендеринг интерфейса --- function renderLessons() { lessonList.innerHTML = ''; lessons.forEach(lesson => { const li = document.createElement('li'); li.className = 'lesson-item'; li.textContent = lesson.title; if (completedLessons.has(lesson.id)) li.classList.add('completed'); if (lesson.id === currentLesson) li.classList.add('active'); li.addEventListener('click', () => loadLesson(lesson.id)); lessonList.appendChild(li); }); } function loadLesson(id) { // Нельзя перескакивать на непройденные уроки if (id > currentLesson && !completedLessons.has(id - 1)) return; currentLesson = id; const lesson = lessons[id]; lessonTitle.textContent = lesson.title; lessonDesc.textContent = lesson.description; codeEditor.value = lesson.starterCode; consoleOutput.textContent = 'Нажмите "Запустить код", чтобы увидеть результат.'; renderLessons(); // Управление кнопками if (completedLessons.has(id)) { runBtn.classList.add('hidden'); nextBtn.classList.remove('hidden'); } else { runBtn.classList.remove('hidden'); nextBtn.classList.add('hidden'); } updateProgress(); } function updateProgress() { progressText.textContent = `Урок ${currentLesson + 1} из ${lessons.length}`; } // --- Логика запуска кода --- async function runCode() { const userCode = codeEditor.value; consoleOutput.textContent = 'Выполнение...'; runBtn.disabled = true; try { // Используем публичный API Wandbox для выполнения Python 3 const response = await fetch('https://wandbox.org/api/compile.json', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ compiler: 'python3', code: userCode, options: { 'save-executable': false, 'compiler-option-raw': '' } }) }); const data = await response.json(); if (data.status === "0") { consoleOutput.textContent = data.program_output || '(Программа завершилась без вывода)'; if (!completedLessons.has(currentLesson)) { completedLessons.add(currentLesson); // Если пройден последний урок if (currentLesson === lessons.length - 1) { consoleOutput.textContent += '\n\n🎉 Поздравляем! Вы прошли весь базовый курс!'; } renderLessons(); runBtn.classList.add('hidden'); nextBtn.classList.remove('hidden'); } } else { consoleOutput.textContent = 'Ошибка выполнения:\n' + data.compiler_error; } } catch (error) { consoleOutput.textContent = 'Ошибка сети. Проверьте подключение к интернету.'; } finally { runBtn.disabled = false; } } // --- Навигация --- function goToNext() { if (currentLesson < lessons.length - 1) { loadLesson(currentLesson + 1); } } // --- Инициализация --- loadLesson(0); runBtn.addEventListener('click', runCode); nextBtn.addEventListener('click', goToNext); // Горячие клавиши: Ctrl + Enter для запуска codeEditor.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runCode(); } }); </script> </body> </html>
